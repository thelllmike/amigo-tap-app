# Builds a signed Android App Bundle and uploads it to Google Play.
#
#   dev  branch → Internal testing (your testers)
#   main branch → Production (everyone)
# So: merge features into dev, test, then merge dev into main to go live.
# It can also be run by hand from the Actions tab ("Run workflow").
#
# Each branch uses a GitHub environment (development / production). Secrets
# set on an environment override the repo-wide ones, e.g. to point dev at a
# separate Supabase project.
#
# android/ is generated by `expo prebuild` and never committed, so signing and
# the version code are passed to Gradle at build time instead of being written
# into build.gradle.
#
# Secrets (Settings → Secrets and variables → Actions):
#   PLAY_SERVICE_ACCOUNT_JSON  service account key with release access in Play Console
#   KEYSTORE_BASE64            base64 of the upload keystore (.jks)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY, EXPO_PUBLIC_SITE_URL
#     the values from .env, which isn't committed

name: Release to Google Play

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [default for the branch, internal, alpha, beta, production]
        default: default for the branch

concurrency:
  group: play-release
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.amigotap.owner
  # Version codes already used on Play by manual uploads. Each run's code is
  # this plus the run number, so it always goes up.
  VERSION_CODE_OFFSET: 1

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SITE_URL: ${{ secrets.EXPO_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Check the app's settings are in place
        run: |
          for v in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing"; exit 1; fi
          done

      - name: Set version code
        id: version
        run: |
          CODE=$(( GITHUB_RUN_NUMBER + VERSION_CODE_OFFSET ))
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.android.versionCode = Number(process.argv[1]);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          ' "$CODE"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version code $CODE"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Restore the upload keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build the signed app bundle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease --no-daemon \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Keep the bundle as a download
        uses: actions/upload-artifact@v4
        with:
          name: amigotap-${{ steps.version.outputs.code }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ (inputs.track && inputs.track != 'default for the branch') && inputs.track || (github.ref_name == 'main' && 'production' || 'internal') }}
          status: completed

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
