# Builds the iOS app (with its App Clip) and uploads it to App Store Connect.
#
#   main branch → uploaded to App Store Connect / TestFlight
#   It can also be run by hand from the Actions tab ("Run workflow").
#
# After a run, the build shows up in TestFlight in 10–30 minutes. Sending it to
# App Review is still done by hand in App Store Connect: open the version, pick
# the build, and Submit for Review.
#
# ios/ is generated by `expo prebuild` and never committed. Signing is done by
# Xcode with an App Store Connect API key (cloud-managed certificates), so no
# certificate or provisioning profile is stored here.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID          App Store Connect API key ID (e.g. ABC123DEFG)
#   ASC_ISSUER_ID       issuer ID shown above the keys list
#   ASC_KEY_P8_BASE64   base64 of the AuthKey_XXXX.p8 file
#     The key needs the Admin role so Xcode can create the distribution
#     certificate and profiles.
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY, EXPO_PUBLIC_SITE_URL
#     same as the Android workflow

name: Release to App Store

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: appstore-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TEAM_ID: 5Q7NL6NTTJ
  # Build numbers already used by uploads from a Mac. Each run's build
  # number is this plus the run number, so it always goes up.
  BUILD_NUMBER_OFFSET: 3

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SITE_URL: ${{ secrets.EXPO_PUBLIC_SITE_URL }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the secrets are in place
        run: |
          for v in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing"; exit 1; fi
          done

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_P8_BASE64" ]; then echo "::error::Secret ASC_KEY_P8_BASE64 is missing"; exit 1; fi
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Set build number
        id: version
        run: |
          BUILD=$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET ))
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.ios.buildNumber = String(process.argv[1]);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          ' "$BUILD"
          VERSION=$(node -p 'require("./app.json").expo.version')
          echo "Version $VERSION ($BUILD)"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Point the Xcode build scripts at Node and the Expo CLI
        # The App Clip's bundle step can't find @expo/cli on its own because
        # npm nests it under expo/.
        run: |
          CLI=$(node -p 'require.resolve("@expo/cli", { paths: [require.resolve("expo/package.json")] })')
          {
            echo "export NODE_BINARY=$(command -v node)"
            echo "export CLI_PATH=\"$CLI\""
          } > ios/.xcode.env.local

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace AmigoTap.xcworkspace \
            -scheme AmigoTap \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/AmigoTap.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 200

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AmigoTap.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded ${{ steps.version.outputs.version }} (${{ steps.version.outputs.build }}) — it will appear in TestFlight shortly." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
